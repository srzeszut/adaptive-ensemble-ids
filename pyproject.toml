[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ensemble-ids"
version = "0.1.0"
description = "Data-Driven Calibration and Online Adaptive Ensemble Weighting for Network Intrusion Detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-learn==1.4.2",
    "pandas==2.2.3",
    "torch==2.2.2",
    "river==0.21.2",
    "deep-river==0.2.6",
    "graphviz==0.21",
    "torchviz==0.0.3",
    "setuptools==82.0.1",
    "hydra-core==1.3.2",
    "codecarbon==3.2.6",
    "matplotlib==3.10.8",
    "tsb-ad==1.5",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_experiment.py" = ["E402"]
"scripts/tune_hyperparams.py" = ["E402"]
"src/pipeline/runner.py" = ["B023"]
