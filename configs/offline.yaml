mode: offline
dataset_dir: data
output_dir: results/offline

seed: 42
val_ratio: 0.15
normalization: robust
batch_size: 256

track_energy: true
run_failure_experiments: false

models:
  - AutoEncoder
  - LSTMAD
  - LOF
  - IForest

calibration:
  sensitivity_weight: 1.0
  competence_weight: 0.25
  discriminability_weight: 0.25
  temperature: 1.0
  n_seeds: 5
  contamination_levels: [0.02, 0.05, 0.10]

tuning: false
tuning_contamination: 0.05
tuning_seed: 1337
